name: Build extension

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "${ANDROID_HOME:-}" ]; then echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"; fi
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "$SDK" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare signing key
        run: |
          mkdir -p ci
          if [ ! -f ci/mangaball.jks ]; then
            echo "Generating a new signing key (first run)"
            keytool -genkeypair -v \
              -keystore ci/mangaball.jks \
              -alias mangaball \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mangaball -keypass mangaball \
              -dname "CN=MangaBall Enhanced, OU=Extensions, O=GitHub, C=US"
            echo "NEW_KEYSTORE=true" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$PWD/ci/mangaball.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=mangaball" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=mangaball" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=mangaball" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          gradle :extension:assembleRelease --no-daemon --console=plain 2>&1 | tee build-output.log

      - name: Save build log on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p build-logs
          {
            echo "### compiler diagnostics"
            grep -n -E "^(e|w): " build-output.log | head -n 120 || true
            echo
            echo "### failure summary"
            sed -n '/What went wrong/,/^\* Try:/p' build-output.log | head -n 80 || true
            echo
            echo "### last 60 lines"
            tail -n 60 build-output.log || true
          } > build-logs/last-build.txt
          head -n 60 build-logs/last-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-logs/last-build.txt
          git commit -m "chore: build log [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Locate APK
        id: apk
        if: success()
        run: |
          find extension/build/outputs/apk -name "*.apk" -printf "%p (%s bytes)\n" || true
          apk=$(find extension/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No signed APK produced"; exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      - name: Print certificate fingerprint
        if: success()
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}" | head -n 5

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mangaball-enhanced-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: MangaBall Enhanced — v1.6.1
          body: |
            Enhanced MangaBall extension for Komikku.

            **Install:** download the APK below, open it on your phone, allow installs from this
            source, then open Komikku → More → Extensions → Untrusted → trust *MangaBall Enhanced*.

            **Features**

            - Enhanced search with an inline query language
              (`tag:romance -tag:ecchi sort:views status:ongoing pages:3`)
            - Sort by latest update, views, rating, newest, title
            - Local ordering by genre, by tag, by tag match, by title, by views, by chapter count
            - Include **or** exclude any genre / theme / format tag, with AND / OR tag logic
            - Language filter that can include and exclude languages
            - Optional: hide 18+ titles, hide chapters of specific scanlators, merge more pages per search

            Site: https://mangaball.com
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
