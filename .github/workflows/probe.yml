name: Probe MangaBall API

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: pip install --quiet curl_cffi

      - name: Impersonation test
        continue-on-error: true
        run: |
          mkdir -p probe-results
          python3 - <<'PY' > probe-results/10-impersonate.txt 2>&1
          from curl_cffi import requests
          targets = [
              ("chrome", "https://mangaball.com/api/v1/title/search-advanced?page=1&limit=1"),
              ("chrome124", "https://mangaball.com/api/v1/title/search-advanced?page=1&limit=1"),
              ("safari17_0", "https://mangaball.com/api/v1/title/search-advanced?page=1&limit=1"),
              ("chrome_android", "https://mangaball.com/api/v1/title/search-advanced?page=1&limit=1"),
          ]
          for imp, url in targets:
              try:
                  r = requests.get(url, impersonate=imp, timeout=45,
                                   headers={"Accept": "application/json, text/plain, */*",
                                            "Accept-Language": "en-US,en;q=0.9",
                                            "Referer": "https://mangaball.com/search-advanced"})
                  print(f"### {imp} -> {r.status_code} len={len(r.content)}")
                  print(r.text[:300].replace("\n", " "))
              except Exception as e:
                  print(f"### {imp} -> ERROR {type(e).__name__}: {e}")
              print("---")
          # plain requests for comparison
          try:
              r = requests.get("https://mangaball.com/api/v1/title/search-advanced?page=1&limit=1", timeout=45)
              print(f"### plain -> {r.status_code}")
          except Exception as e:
              print(f"### plain -> ERROR {e}")
          PY
          cat probe-results/10-impersonate.txt

      - name: Session based access (HTML first, then API)
        continue-on-error: true
        run: |
          python3 - <<'PY' > probe-results/11-session.txt 2>&1
          from curl_cffi import requests
          s = requests.Session(impersonate="chrome")
          try:
              home = s.get("https://mangaball.com/", timeout=45)
              print("home:", home.status_code, len(home.content))
              print("cf cookies:", [c.name for c in s.cookies.jar])
              r = s.get("https://mangaball.com/api/v1/title/search-advanced?page=1&limit=1", timeout=45,
                        headers={"Accept": "application/json, text/plain, */*", "Referer": "https://mangaball.com/"})
              print("api:", r.status_code, len(r.content))
              print(r.text[:400].replace("\n", " "))
          except Exception as e:
              print("ERROR", type(e).__name__, e)
          PY
          cat probe-results/11-session.txt

      - name: Commit results
        continue-on-error: true
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -A probe-results
          git commit -m "chore: probe results [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
