name: Probe MangaBall API

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
      - 'tools/probe/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          mkdir -p probe-results
          {
            echo "python: $(python3 -V 2>&1)"
            echo "pip: $(python3 -m pip -V 2>&1)"
            echo "--- installing curl_cffi ---"
            python3 -m pip install --quiet curl_cffi 2>&1
            echo "install exit: $?"
            python3 -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)" 2>&1
          } > probe-results/00-env.txt 2>&1
          cat probe-results/00-env.txt

      - name: Probe routes
        run: |
          python3 tools/probe/probe_http.py > probe-results/10-routes.txt 2>&1
          tail -60 probe-results/10-routes.txt

      - name: Commit results
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe-results
          git commit -m "chore: probe results [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          ls -la probe-results || true
